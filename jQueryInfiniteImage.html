<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image chnage infinite</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        html {
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, coral, purple, indigo);
            padding: 2rem 5rem;
        }

        #imageContainer {

            background-color: rgba(255, 255, 255, 0.322);
            width: 300px;
            padding: 1.5rem;
            height: 300px;
            border-radius: .5rem;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items:  center;
            box-shadow: 0 0 10px white;
        }

        #images {
            width: 250px;
            height: 250px;
            display: none;
            object-fit: cover;
            border-radius: 1rem;
            box-shadow: 2px 2px 10px rgba(255, 255, 255, 0.514),
                        -2px -2px 10px rgba(0, 0, 0, 0.507);
           
        }

        #btn {
            padding: .5rem 2rem;
            margin: 1rem 0;
            border-radius: .5rem;
            background-color: rgba(240, 248, 255, 0.426);
            backdrop-filter: blur(10px);
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            border: .1px solid rgba(255, 255, 255, 0.255);
            transition: transform 1s ease;
        }

        #btn:hover {
            background-color: white;
            color: rgb(255, 138, 230);
            border: 1px solid rgb(255, 138, 230);
            transform: scale(1.05);
        }

        #btn:active {
            opacity: 0.8;
        }

        span {
            color: rgb(68, 178, 68);
        }

        h1 {
            color: white;
            text-transform: uppercase;
            font-weight: bolder;
            margin-bottom: 1rem;
            border-bottom: 4px solid white;
            padding: .5rem;
        }
        p{
            color: rgba(255, 255, 255, 0.462);
            text-align: center;
            font-weight: 500;
            

        }
      
    </style>
</head>

<body>
    <h1>Unlimited <span>Image Slider</span></h1>
    <div id="imageContainer">
        <p>Click Below for images</p>
        <img src="" alt="" id="images">
    </div>
    <button id="btn">Next Image</button>


    <script>
        $(document).ready(function () {

            const imageArray = [
                {
                    image: "/IMAGES/girl.jpg"
                },
                {
                    image: "/IMAGES/sunset.jpg"
                },
                {
                    image: "/IMAGES/waterfall.jpg"
                },
                {
                    image: "/IMAGES/chairs.jpg"
                }
            ];
            var imageIndex = 0;

            $("#btn").click(function () {

                $("p").hide();
                $("#images").fadeIn();
                
                if (imageIndex >= imageArray.length - 1) {
                    imageIndex = 0;
                } else {
                    imageIndex++;
                }

                $("#images").attr("src",imageArray[imageIndex].image);

                
            })
        })
    </script>
</body>

</html>
