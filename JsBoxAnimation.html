<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <Style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh
        }


        #box{
            width: 100px;
            height: 100px;
            background-color: crimson;
            animation: spin linear 3s forwards paused;
        }
        @keyframes spin{
            from{
                border-radius: 0;
                transform: translateY(0px)  rotate(0deg) scale(2);
                background-color: red;
               
                
            }
            to{
                border-radius: 50%;
                transform: translatex(15rem) rotate(360deg) scale(1);
                background-color: chartreuse;
                border: 2px solid white;
                box-shadow: 0px 0px 15px 0px yellow;
               
                
            }
        }
        #btn{
            position: fixed;
            bottom: 2rem;
            padding: 1rem 2rem;
            border: none;
            background-color: brown;
            box-shadow: 0px 0px 10px 0px gray;
            border-radius: 1rem;
            color: white;
        }

    </Style>
</head>
<body>
    <div id="box"></div>
    <button id="btn">Change shape</button>
    



    <script>
        var btn = document.getElementById("btn");
        var box = document.getElementById("box");

        btn.addEventListener("click",function(){

            box.style.animationPlayState="running"

        })
    </script>
</body>
</html>
