<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        
        
    .container{
        display: grid;
        grid-template-columns:repeat(4,1fr);
        grid-template-rows: repeat(8,1fr);
        gap: .4px;
        width:100%;
        height: 100%;
        
        margin: auto 0px;
        
        grid-template-areas: 
        "header header header header"
        "header header header header"
        "nav nav main main"
        "nav nav main main"
        "nav nav main main"
        "nav nav main main"
        "nav nav main main"
        "nav nav footer footer"
        ;
    }
    .container div{
        
        
    }
    .header{grid-area: header;}
    .nav{grid-area: nav;}
    .main{grid-area: main;}
    .footer{grid-area: footer;}

    


    .header{
        text-align: center;
        position: relative;
        background:linear-gradient(45deg,rgb(0, 130, 190),black,black);
        
    }
    .one,.two{

        
        display: inline-block;
        

    }
    .one{
        font-family: Verdana;
        color: white;
    }
    .two{
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-size:50px;
        color: rgb(0, 130, 190);
        translate: -10px 7px;
        
    }
    .nav{
        background-image: url("/IMAGES/sidebar1.jpg");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center center;
        
    }
   
    .footer{
        background-color: black;
    }
    .form{
        text-align: center;
        padding: 1px;
        background-color: black;
    }
    .form h1{
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: rgb(28, 171, 237);
        font-variant: small-caps;
    }
    .form-box{
        padding: 20px 5px 0px 5px;
        margin: 0px auto;
        margin-bottom: 10px;
        border: 0px;
        width: 90%;
        height:156px;
        position: relative;
        background-color:white;
        color: white;
        border-radius: 10px;
        box-shadow: 0px 0px 5px white;
    }
    .form-box .four,.three{
        margin: 7px;
        padding: 3px;
        border: 0px;
        box-shadow: 0px 0px 5px gray;
        border-radius: 5px;
        padding: 5px 0px 5px 20px;
    }
    .three:hover,.four:hover{
        transform: scale(1.07,1.07);
    }
    .three::placeholder,.four::placeholder{
        color: rgb(0, 130, 190);
        font-size: smaller;
        font-family:Verdana, Geneva, Tahoma, sans-serif;
    }
    a:active{
        color: red;
    }
    a:visited{
        color: blue;
    }
    .form-box .check,.para1{
        display: inline-block;
    }
    .para1{
        font-size:xx-small;
        color: black;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
    }
    a{
        font-size: x-small;
        margin-left: 19px;
        color:rgb(0, 130, 190);
    }
    .btn{
        margin-top: 15px;
        width: 100px;
        height: 25px;
        border-radius: 50px;
        border: 0px ;
        box-shadow: 0px 0px 5px rgb(255, 255, 255);
        background: linear-gradient(45deg,rgb(0, 130, 190),black);
        font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        color: white;
    }
    .btn:hover{
        
        transform: scale(1.2,1.2);
        background: linear-gradient(45deg,rgb(4, 175, 255),black);
        box-shadow: 0px 0px 5px white;
    }
    .footer .foot{
        color: white;
        font-size: 5px;
        text-align: center;
        margin-top: 15px;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
    }

    
    </style>
    
</head>
<body>
    

        <div class="container">
        <div class="header">
            <h1 class="tittle one">Crypto</h1>
            <h1 class="tittle two">X</h1>
        </div>
        <div class="nav"></div>
        <div class="main">
            <div class="form">
                <h1>User Login</h1>
                <div class="form-box">
                    <input type="text" class="three" placeholder="Enter your Username">
                    <input type="password" name="" id="" class="four" placeholder="Enter your Password">
                    <div class="checkbox">
                        <input type="checkbox" name="" id="" checked class="check">
                        <p class="para1">Remember me</p>
                        <a href="">Forgot Password?</a>
                    </div>
                    <input type="button" value="LOGIN" class="btn">
                    
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="foot">
                <p>@copyright Sajeesh alexander 961722104038</p>
                <p>Kochi | Delhi | tvm</p>
            </div>
            
        </div>
    </div>


    
    
</body>
</html>
