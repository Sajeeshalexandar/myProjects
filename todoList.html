<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }


        html {
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
        }

        #todo-section {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, red, orange, yellow);
        }

        .todo-container {
            background-color: whitesmoke;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 2rem 4rem;
            border-radius: 2rem;
            box-shadow: 0px 0px 10px 0px rgb(255, 255, 255);
        }

        span {
            color: orange;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .todo-container input {
            border-radius: 1rem;
            padding: .5rem 2rem;
            border: 3px solid orange;
        }

        .todo-container input::placeholder {
            color: black;
        }

        #btn {
            padding: .5rem 1rem;
            border-radius: 1rem;
            background-color: orange;
            color: white;
            border: 3px solid orange;
            box-shadow: 1px 2px 1px 0px gray;
        }

        #taskArea {
            width: auto;
            height: auto;
            background-color: rgb(255, 220, 156);
            padding: .8rem 1rem;
            margin: .5rem 0;
            border-radius: 1rem;


        }
    </style>
</head>

<body>
    <section id="todo-section">
        <div class="todo-container">
            <div class="heading">
                <h1>Todo<Span>List</Span></h1>
            </div>
            <div class="add-content">
                <input type="text" placeholder="Enter tasks" id="input-task">
                <button id="btn">Add</button>
                <div id="taskArea"></div>
            </div>
        </div>
    </section>



    <script>

        let btn = document.querySelector("#btn");
        

        btn.addEventListener("click", function () {

            var input = document.querySelector("#input-task").value;
            var textArea = document.querySelector("#textArea");

            let box = document.createElement("div");
            let text = document.createTextNode(input);

            
            box.appendChild(text);
            textArea.appendChild(box)

            



        })
    </script>

</body>

</html>
