<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }


        html {
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
        }

        #todo-section {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, red, orange, yellow);
        }

        .todo-container {
            background-color: whitesmoke;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 2rem 4rem;
            border-radius: 2rem;
            box-shadow: 0px 0px 10px 0px rgb(255, 255, 255);
        }

        span {
            color: orange;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .todo-container input {
            border-radius: 1rem;
            padding: .5rem 2rem;
            border: 3px solid orange;
        }

        .todo-container input::placeholder {
            color: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #btn {
            padding: .5rem 1rem;
            border-radius: 1rem;
            background-color: orange;
            color: white;
            border: 3px solid orange;
            box-shadow: 1px 2px 1px 0px gray;
        }

        /* TASK AREA CONTAINER */
        #taskArea {
            width: 100%;
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 1.2rem;

            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.05);
        }

        /* INDIVIDUAL TASK */
        #taskArea p {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0.7rem 1rem;
            border-radius: 0.8rem;

            background: linear-gradient(135deg, #ffffff, #f1f1f1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);

            font-size: 0.95rem;
            font-weight: 500;
            color: #333;

            transition: all 0.3s ease;
        }

        /* HOVER EFFECT */
        #taskArea p:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12);
        }

        /* BUTTON CONTAINER (OPTIONAL BUT BETTER) */
        .task-buttons {
            display: flex;
            gap: 0.4rem;
        }

        /* BUTTON BASE STYLE */
        .btnStyle {
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            transition: all 0.25s ease;

            background: rgba(0, 0, 0, 0.05);
        }

        /* DELETE BUTTON */
        .delete-btn {
            color: #ff4d4d;
        }

        .delete-btn:hover {
            background: #ff4d4d;
            color: white;
        }

        /* COMPLETE BUTTON */
        .complete-btn {
            color: #28c76f;
        }

        .complete-btn:hover {
            background: #28c76f;
            color: white;
        }

        /* COMPLETED TASK STYLE */
        .completed {
            text-decoration: line-through;
            color: #2e7d32;
        }

        .task-done-bg {
            background: linear-gradient(135deg, #d4edda, #c3e6cb) !important;
        }

     

        /* Tablets (≤ 1024px) */
        @media (max-width: 1024px) {

            .todo-container {
                padding: 1.8rem 2rem;
                width: 90%;
            }

            .todo-container h1 {
                font-size: 1.8rem;
            }

            .todo-container input {
                width: 100%;
            }

            #btn {
                width: 100%;
                margin-top: 0.5rem;
            }

            .add-content {
                display: flex;
                gap: 0.5rem;

                flex-direction: column;
            }

        }



        /* Mobile (≤ 600px) */
        @media (max-width: 600px) {

            #todo-section {
                padding: 1rem;
            }

            .todo-container {
                width: 100%;
                padding: 1.5rem 1rem;
                border-radius: 1.2rem;
            }

            .todo-container h1 {
                font-size: 1.5rem;
                text-align: center;
            }

            /* Input + Button stacked */
            .add-content {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
            }

            .todo-container input {
                width: 100%;
                padding: 0.6rem;
                font-size: 0.9rem;
            }

            #btn {
                width: 100%;
                padding: 0.6rem;
                font-size: 0.9rem;
            }

            /* Task item */
            #taskArea p {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            /* Buttons move below text */
            .task-buttons {
                width: 100%;
                justify-content: flex-end;
            }

            .btnStyle {
                width: 28px;
                height: 28px;
            }
        }


        /* Small mobile (≤ 400px) */
        @media (max-width: 400px) {

            .todo-container h1 {
                font-size: 1.3rem;
            }

            .todo-container input {
                font-size: 0.85rem;
            }

            #btn {
                font-size: 0.85rem;
            }

            #taskArea {
                padding: 0.6rem;
            }
        }
    </style>
</head>

<body>
    <section id="todo-section">
        <div class="todo-container">
            <div class="heading">
                <h1>Todo<Span>List</Span></h1>
            </div>
            <div class="add-content">
                <input type="text" placeholder="Enter your task..." id="input-task">
                <button id="btn">Add</button>
                <div id="taskArea">


                </div>
            </div>
        </div>
    </section>



    <script>

        let btn = document.querySelector("#btn");

        btn.addEventListener("click", function () {
            let inputField = document.getElementById("input-task");
            let input = inputField.value.trim(); // important
            let taskArea = document.querySelector("#taskArea");

            if (input === "") {
                alert("Please enter a task");
                return;
            }

            // CREATE TASK
            let task = document.createElement("p");

            let taskText = document.createElement("span");
            taskText.textContent = input;
            task.appendChild(taskText);
            // BUTTON CONTAINER
            let btnContainer = document.createElement("div");
            btnContainer.classList.add("task-buttons");

            // COMPLETE BUTTON
            let cmpBtn = document.createElement("button");
            cmpBtn.innerHTML = '<i class="fa-solid fa-check"></i>';
            cmpBtn.classList.add("btnStyle", "complete-btn");

            cmpBtn.addEventListener("click", () => {
                taskText.classList.toggle("completed");   // only text
                task.classList.toggle("task-done-bg");    // full row background
            });
            // DELETE BUTTON
            let delBtn = document.createElement("button");
            delBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            delBtn.classList.add("btnStyle", "delete-btn");

            delBtn.addEventListener("click", () => {
                task.remove();
            });


            btnContainer.appendChild(cmpBtn);
            btnContainer.appendChild(delBtn);

            task.appendChild(btnContainer);
            taskArea.appendChild(task);

            // CLEAR INPUT
            inputField.value = "";
        });
    </script>

</body>

</html>
