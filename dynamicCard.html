<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card Loading</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            
        }

        .cardContainer {
            margin-top: 6rem;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 2rem 5rem;
        }

        .card-box {
            border-radius: 2rem;
            background-color: white;
            padding: 2rem .5rem 1rem;
            color: black;
            font-family: Arial, Helvetica, sans-serif;
            box-shadow: 0 2px 15px rgba(128, 128, 128, 0.808);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: 0.3s ease;

        }

        .card-box:hover {
            transform: translateY(-5px);
            
            box-shadow: 0 0px 15px rgb(93, 93, 93);


        }

        .card-box img {
            width: 250px;
            height: 250px;
            object-fit: cover;
          
            border-radius: 1rem;




        }

        .card-contents {
            padding: 1rem 3rem 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;

        }

        .card-contents h2 {
            font-weight: bold;
            color: rgb(0, 55, 117);
        }

        .card-contents p {
            padding: .5rem 0rem 1rem;
        }

        .btn {
            padding: 1rem 2rem;
            background-color: rgb(0, 139, 219);
            border-radius: .5rem;
            border: none;
            font-weight: bolder;
            color: white;
            transition: 0.3s ease;
           

        }

        .btn:hover {
            transform: scale(1.03);

        }
        header{
            padding: 2rem 5rem;
            border-bottom: 1px solid white;
            z-index: 1000;
            backdrop-filter: blur(10px);
            width: 100%;
            background-color: rgba(0, 0, 0, 0.278);
            position: fixed;
            top: 0;
            left: 0;

        }
        header ul{
            display: flex;
            justify-content: space-between;
            align-items: center;

        }
        header ul li h1{
            color: rgb(0, 183, 255);
            text-shadow: 2px 0 2px rgb(0, 0, 0),
                        -2px 0 2px white;
        }
        header ul li{
            list-style: none;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
        }
        span{
            color: red;
        }
    </style>
</head>

<body>
    <header>
        <ul>
            <li><h1>FlipKart</h1></li>
            <li><i class="fa-solid fa-cart-shopping" style="color: rgb(255, 255, 255);"></i><span id="cartCount">0</span></li>
        </ul>
    </header>
  
          <div class="cardContainer" id="cardContainer"></div>
 
  


    <script>
        var cardContainer = document.querySelector("#cardContainer");
        var count = 0;

        const cards = [
            {
                tittle: "Apps",
                paragraph: "These are the applications which we are developing to the clients with 100% accuracy.",
                image: "/IMAGES/app_develop.jpg"
            },
            {
                tittle: "Cloud Services",
                paragraph: "we provides all the types of cloud related supports for the users just for reasonable prices",
                image: "/IMAGES/cloud_services.jpg"
            },
            {
                tittle: "Graphic Design",
                paragraph: "for realstic and mordern proffessional designs contact us. we have wide range of collections and varitey designs",
                image: "/IMAGES/graphic_design.jpg"
            },
            {
                tittle: "Digital Marketing",
                paragraph: "meta ads,email marketing,advertising etc we provide for the customers with 100% genuenly and accurately it will reaches the customers",
                image: "/IMAGES/digital_marketing.jpg"
            },
            {
                tittle: "Sunflower",
                paragraph: "sunflower is the one of the flower which produces oil at the same time it will provide beautifull asthetic feel",
                image: "/IMAGES/sunflower.jpg"
            },
            {
                tittle: "Web Development",
                paragraph: "We deveops better website with all the mordern features an full support from the staring to the hosting",
                image: "/IMAGES/web_develop.jpg"
            },
            {
                tittle: "Van",
                paragraph: "This van is  for sale with asthetic look and vintage model only for just 70,000 rupees",
                image: "/IMAGES/van.jpg"
            },

        ]

        cards.forEach((card) => {
            var cardBox = document.createElement("div")
            cardBox.classList.add("card-box");
            cardBox.innerHTML =
                `
                <img src = ${card.image} alt = ${card.tittle}>
                <div class = "card-contents">
                    <h2>${card.tittle}</h2>
                    <p>${card.paragraph}</p>
                    <button class = "btn">Add to Cart</button>
                    
                </div>
                `;
                cardContainer.appendChild(cardBox);

                var cartBtn = cardBox.querySelector(".btn");
                cartBtn.addEventListener("click",()=>{
                    count++;
                    document.querySelector("#cartCount").innerText = count;
                    cardBox.style.display = "none";
                })
         
                    
                })
        


    
        
    </script>
</body>

</html>
