<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day-night</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        body{
            height: 100vh;
            background-color: rgb(30, 30, 63);
            display: flex;
            align-items: center;
            justify-content: center;
            
        }
        .pill{
            z-index: 2;
            overflow: hidden;
            position: relative;
            height: 330px;
            width: 180px;
            border-radius: 110px;
            box-shadow: 0px 0px 10px 0px;
            
            background:linear-gradient(180deg,rgb(255, 0, 0),rgb(255, 34, 34),rgb(255, 177, 31),yellow)
        }
        .circle1{
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 22px auto;
            height: 140px;
            width: 140px;
            background-color: transparent;
            border-radius: 50%;
            
            z-index: 3;
            transition: box-shadow 1s ease,background-color 1s ease;

        }
        .circle2{
            
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
            width: 100px;
            border-radius: 50%;
            background-color: transparent;
            transition: box-shadow 1s ease,background-color 1s ease;
            z-index: 4;
        
            
        }
        .sun{
            
            height: 50px;
            width: 50px;
            background:linear-gradient(yellow,orange);
            border-radius: 50%;
            z-index: 5;
            opacity: 100%;
            box-shadow: 1px 1px 20px 8px orange;
            transition: opacity 1s ease,transform 1s ease;
        }
        .pill:hover{
            background: linear-gradient(#1d0a6d,#2b4de0,#4aa3ff);
            .sun{
                opacity: 0;
                transform: scale3d(0,0,1);
            }
            .moon{
                transform: translateY(-205px);
                scale: 1;
                opacity: 1;
            }
            .mountain{
                border-bottom:150px solid #2f2f2f;
            }
            .stars{
                opacity: 1;
                box-shadow: 
                100px 40px 2px white,
                30px 50px 2px white,
                150px 60px 2px white,
                10px 70px 2px white,
                20px 80px 2px white,
                40px 90px 2px white,
                150px 100px 2px white,
                160px 110px 2px white,
                30px 120px 2px white,
                80px 130px 2px white,
                120px 140px 2px white,
                70px 150px 2px white,
                20px 160px 2px white,
                130px 50px 2px white
            ;
                
            }
        }
        .container:has(.pill:hover){
            background-color: #0c013a;
        }
            
        
        .moon{
            position: absolute;
            height: 50px;
            width: 50px;
            border-radius: 50%;
            background: white;
            box-shadow:0px 0px 10px 5px white ;
            border: 1px solid rgb(241, 241, 241);
            top: 90%;
            left: 50%;
            opacity: 0;
            translate: -50% -50%;
            z-index: 6;
            scale:-0 ;
            transition: transform .3s ease-in-out,opacity 1s ease-in,scale 1s ease;
        }
        .mountain{
            position: absolute;
            left: 55%;
            transform: translatex(-50%);
            bottom: -50px;
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 120px solid transparent;
            border-bottom: 180px solid #5a3a2e;
            transition: border-bottom 1s ease ;

            z-index: 7;
        }
        .two{
            left: 15%;
            bottom: -19px;
        }
        .three{
            left: 95%;
        }
        .four{
            left: 75%;
            bottom: -20px;
        }
        .five{
            left:35% ;
            
        }
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(255, 255, 255);
            width: 100%;
            height: 100%;
            transition: background-color 1s ease;
        }
        .stars{
            opacity: 0;
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;

            transform: opacity 5s ease,box-shadow 5s ease;
        }
        
     
    </style>
</head>
<body>
    <div class="container">
        <div class="pill">

            <div class="mountain one"></div>
            <div class="mountain two"></div>
            <div class="mountain three"></div>
            <div class="mountain four"></div>
            <div class="mountain five"></div>

            <div class="stars"></div>

            <div class="moon"></div>

           <div class="circle1">
            <div class="circle2">

                <div class="sun">

                </div>
            </div>
           </div>
        </div></div>
        


            
    
    
</body>
</html>
