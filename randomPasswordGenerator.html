<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>password Generator</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        html{
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            background: linear-gradient(45deg,rgb(0, 255, 0),rgb(0, 166, 0),rgb(0, 74, 0));
        }
        #container{
            width: 500px;
            height: 150px;
            background-color: rgba(44, 39, 39, 0.411);
            border-radius: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            box-shadow: 0 0 15px white;
          
        }
         
        #screen{
            background-color: white;
            padding: .5rem 1rem;
            border-radius: 1rem;
            display: flex;
            justify-content: space-between;
            width: 300px;
        }
        #inputBox{
            padding: .1rem;
            width: 100%;
            outline: 0;
            border: none;
            
        }
        #copyBtn{
            border: none;
            background-color: transparent;
            height: 100%;
            font-weight: bolder;
            cursor: pointer;
            outline: 0;
            color: rgb(0, 173, 242);
        }
        #copyBtn:active{
            opacity: 0.8;
        }
        #generateBtn{
            padding: .5rem 2rem;
            background: linear-gradient(90deg,green,rgb(55, 237, 55));
            color: white;
            font-weight: bolder;
            border: none;
            margin-top: .5rem;
            border-radius: .5rem;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.76),
                        -2px -2px 3px rgba(255, 255, 255, 0.655);
        }
        #generateBtn:active{
            opacity: 0.8;
        }

        h1{
        text-transform: uppercase;
        }
        p{
            text-transform: capitalize;
            color: rgba(245, 245, 245, 0.599);
            padding-bottom: .4rem;
            margin-bottom: .8rem;
            border-bottom: 5px solid green;

        }
        span{
            color: white;
        }

    </style>
</head>
<body>
    <h1>random<span> password Generator</span></h1>
    <p>you can create unlimited passwords and copy it</p>
    <div id="container">
        <div id="screen">
            <input type="text" id="inputBox" placeholder="Click below to generate pass..!">
            <button id="copyBtn">copy</button>

</body>
</html>
