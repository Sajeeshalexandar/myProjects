<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript card create</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(3600deg,rgb(0, 43, 86),rgb(3, 82, 171),rgb(18, 100, 195),rgb(0, 153, 255));
        }
        header{
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        header h1{
            color: White;
            font-family: Arial, Helvetica, sans-serif;
            margin: 2rem 0 0;
            
        }
        #btn {
            padding: 1rem 2rem;
            background-color: skyblue;
            border-radius: 1rem;
            color: rgb(0, 87, 168);
            border: none;
            width: 10rem;
            box-shadow: 
                        4px 4px 5px 0px rgba(34, 34, 34, 0.674),
                        -4px -4px 10px 0px rgba(74, 183, 255, 0.908);
            margin: 2rem 3rem;
        }
         #btn:hover{
            background-color: rgb(0, 87, 168);
            color: skyblue;
            box-shadow: 0px 0px 15px 0px white;
         }


        section {
            width: 100%;
            padding: 1rem 5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(300px,1fr));
            gap: 1rem;
            align-items: center;
            justify-content: center;
            
            
        }

        div {
            background: linear-gradient(180deg,rgb(0, 208, 255),rgb(0, 180, 221),rgb(0, 140, 171),rgb(1, 74, 91));
            box-shadow: 0px 0px 10px 0px white;
            text-align: center;
            color: black;
            width: 300px;
            padding: 1.5rem;
            border-radius: 2rem;
            border: 2px solid white;
            margin: 0 auto;
            color: white;

            vertical-align: top;
        }
      
        div:hover{
            scale: 1.05;
            transition: 0.3s ease-in-out;
        }
        div p{
            color: rgb(255, 255, 255);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-shadow: 0px 0px 2px black;
            padding-bottom: 1rem;
        }
       
        div h3{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bolder;
            font-size:xx-large;
        }
        
        div img {
            width: 100%;
            height: auto;
            border-radius: 0.5rem;
            margin: 1rem 0;
            box-shadow: 0px 0px 10px 0px white;
            
        }
        div a{
            text-decoration: none;
            color : rgb(0, 0, 0);
        
            padding: .5rem 1.5rem;
            border-radius: 2rem;
            text-align: center;
            border: 1px solid white;
            background-color: rgb(46, 184, 0);
            
            
        }
    </style>
</head>

<body>
    <header>
        <h1>Dynamic card Creation</h1>
        <button id="btn">Create Card</button>
    </header>

    <section id="hero">


    </section>


    <script>
        var btn = document.getElementById("btn");
        var section = document.getElementById("hero");

        btn.addEventListener("click", () => {

            let headContent = "SCOPE INDIA";
            let paraContent = "Scope India is a company which provides software solutions.It is located in Trivandrum,thampanoor,s s koviloor road.";
            let card = document.createElement("div");

            let head = document.createElement("h3");
            head.innerText = headContent;

            let img = document.createElement("img");
            img.src = "IMAGES/graphic_design.jpg";
           
            let para = document.createElement("p");
            para.innerText = paraContent;

            let navigation = document.createElement("a");
            navigation.href="https://youtube.com";
            navigation.text="click for more";
            navigation.target="_blank"
            

            card.appendChild(head);
            card.appendChild(img);
            card.appendChild(para);
            card.appendChild(navigation);

            section.appendChild(card);

        })

    </script>
</body>

</html>
