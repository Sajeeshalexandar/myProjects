<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid box</title>
    <style>
        .container{
            width: 400px;
            height: 250px;
            margin: 0px auto;
            background-color: beige;
            display: grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(3,1fr);
            gap: 5px;
        }
        .container div{
           
           border-radius: 5px;
           display: flex;
           justify-content: center;
           align-items: center;
           font-family: Verdana, Geneva, Tahoma, sans-serif;
           font-size: xx-small;
        }
        .items1{
            grid-row: 1/4;
            background-color: rgb(142, 208, 104);
        }
        .items2{
            grid-column: 2/4;
            background-color: rgb(142, 208, 104);
        }
        .items3{
            background-color: rgb(247, 97, 43);
        }
        .items4,.items8{
            background-color: rgb(255, 196, 0);
        }
        .items5,.items7{
            background-color:  rgb(247, 97, 43);
        }
        .items6{
            grid-column: 4/5;
            grid-row: 2/4;
            background-color: rgb(142, 208, 104);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items1">BOX 1</div>
        <div class="items2">BOX 2</div>
        <div class="items3">BOX 3</div>
        <div class="items4">BOX 4</div>
        <div class="items5">BOX 5</div>
        <div class="items6">BOX 6</div>
        <div class="items7">BOX 7</div>
        <div class="items8">BOX 8</div>
    </div>
</body>
</html>
