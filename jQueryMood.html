<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(45deg, green, yellow, orange, red, rgb(73, 31, 198));
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

        }

        .container {
            padding: 1rem 2rem;
            display: flex;
            background-color: rgba(0, 0, 0, 0.445);
            backdrop-filter: (blur(10px));
            border-radius: 1rem;
            transition: 1s ease ;

        }
        .container:hover{
            transform: scale(1.5);
        }

        .container div {
            padding: 1rem;
        }

        .container div:hover {
            transform: scale(2);

        }

        .happyz {
            background: rgba(172, 255, 47, 0.837);
        }

        .sadz {
            background: rgb(0, 225, 255);
        }

        .angryz {
            background: red;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="happy">😂</div>
        <div class="sad">😭</div>
        <div class="angry">🤬</div>
    </div>

    <script>
        $(document).ready(function () {
            $(".happy").click(function () {
                $("body").addClass("happyz");
                $(".container").empty()
                $(".container").before("<h1>You Are In Happy Moood</h1>")
                $(".container").append("😁")
                $(".container").css({"backgroundColor":"transparent","transform":"scale(2)"})
                
            })
            $(".sad").click(function () {
                $("body").addClass("sadz");
                $(".container").empty()
                $(".container").before("<h1>You Are In sad Mood</h1>")
                 $(".container").append("🥺")
                $(".container").css({"backgroundColor":"transparent","transform":"scale(2)"})
            })
            $(".angry").click(function () {
                $("body").addClass("angryz");
                $(".container").empty()
                $(".container").before("<h1>You Are In angry Moood</h1>")
                 $(".container").append("😤")
                $(".container").css({"backgroundColor":"transparent","transform":"scale(2)"})
            })
        })
    </script>
</body>

</html>
