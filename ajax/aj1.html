<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <style>
        html{
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        h1{
            color: green;
            padding: .2rem;
        }
        button{
            padding: .5rem 2rem;
            border-radius: 1rem;
            border: none;
            background-color: rgb(0, 162, 255);
            color: white;
            font-weight: 800;
        }
        button:active{
            opacity: 0.8;
            background-color: rgba(255, 0, 0, 0.116);

        }
        #result{
            
            margin: 1rem;
            padding: 1rem 2rem;
            border-radius: .5rem;
            box-shadow: 0 0 15px rgba(128, 128, 128, 0.448);
        }
        #result img{
            object-fit: cover;
            border-radius: .3rem;
            margin: .5rem;
            transition: .3s ease;
            
        }
        #result img:hover{
            transform: scale(1.03);
        }
    </style>
</head>

<body>
    <h1>Jquery Ajax load example</h1>
    <button id="load">load</button>
</body>
<div id="result">
    Content will appear here..!
</div>


<script>
    $(Document).ready(function(){
       $("#load").click(function(){
         $("#result").load("gallery.html");
       })

    })
</script>
</html>
