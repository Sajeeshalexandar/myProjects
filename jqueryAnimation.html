<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;

        }

        body {
            width: 100%;
            height: 100vh;
            position: relative;
            background-color: beige;
        }

        .ball {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            position: absolute;
            left: 100px;
            top: 100px;
            background-color: rgb(255, 101, 101);
        }

        #btn {
            padding: 1rem 2rem;
            background-color: rgb(35, 255, 35);
            border: none;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translate(-50% -50%);
            border-radius: 1rem;
            transition: 0.3 ease transform;



        }

        #btn:hover {
            transform: scale(1.02);
            background-color: black;
            color: rgb(35, 255, 35);
        }

        .basket {
            width: 100px;
            height: 200px;
            position: absolute;
            bottom: 10px;
            right: 10px;
            background-color: brown;
            border-end-end-radius: 2rem;
            border-bottom-left-radius: 2rem;
            border-top: 5px solid;
        }
    </style>
</head>

<body>
    <div class="ball"></div>
    <button id="btn">Roll th ball</button>
    <div class="basket"></div>






    <script>
        $(document).ready(function () {
            $("#btn").click(function () {
                $(".ball")
                    .animate({ left: "150px", top: "100px", }, 1000)
                    .animate({ left: "150px", top: "150px" }, 1000)
                    .animate({ left: "200px", top: "150px" }, 1000)
                    .animate({ left: "200px", top: "200px" }, 1000)
                    .animate({ left: "250px", top: "200px" }, 1000)
                    .animate({ left: "250px", top: "250px" }, 1000)


                    .animate({ left: "300px", top: "250px" }, 1000)
                    .animate({ left: "300px", top: "300px" }, 1000)
                    .animate({ left: "350px", top: "300px" }, 1000)
                    .animate({ left: "350px", top: "350px" }, 1000)
                    .animate({ left: "400px", top: "350px" }, 1000)
                    .animate({ left: "400px", top: "400px" }, 1000)


                    .animate({ left: "450px", top: "400px" }, 1000)
                    .animate({ left: "450px", top: "450px" }, 1000)
                    .animate({ left: "675", top: "450px" }, 1000)
                    .animate({ left: "675", top: "600px",width:"50px" }, 1000)
                    
                   
            })
        })

    </script>
</body>

</html>
