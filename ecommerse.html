<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online store</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family:Arial, Helvetica, sans-serif;
        }
        :root{
            --main-color:rgb(0, 153, 255);
            --bg-color:rgb(0, 0, 0);
            --secondbg-color:rgb(37, 37, 37);
            --text-color:white;
            --hightlight-color:rgb(1, 177, 1);
        }
        body{
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-color: var(--bg-color);
            color:var(--text-color);
           
        }
        .header{
            min-width: 100vw;
            height: 15vh;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            background-color: var(--main-color);
            position: fixed;
            top: 0;
            left: 0;
            padding: 1rem 5rem;

        }
        .head-logo h1{
            font-family:sans-serif;
        }
        .head-logo span{
            color: black;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif ;
            font-size: larger;
        }
        .header input{
            width: 40vw;
            height: 5vh;
            border-radius: 2rem;
            padding: 1rem 3rem;
            text-align: left;
            border: .1px solid var(--main-color);
            outline: none;
            background-color: var(--main-color);
            box-shadow: 3px 3px 10px rgb(30, 187, 255),
                        -3px -3px 10px rgba(42, 42, 42, 0.452);
        }
        .header input::placeholder{
            color: var(--text-color);
        }
        .navlinks ul{

            
            
            display: flex;
            justify-content: space-between;
            gap: 2rem;
            list-style: none;
            padding: .3rem 1rem;
           
            
        }
        .navlinks ul li a{
            text-decoration: none;
            color: var(--text-color);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="head-logo">
            <h1>Flip<span>Kart</span></h1>
        </div>
        <input type="text" placeholder="Search for products,itemscosmetics...">
        <nav class="navlinks">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Products</a></li>
                <li><a href="">Login</a></li>
                <li><a href="">Settings</a></li>
                
            </ul>
        </nav>
    </header>
</body>
</html>
