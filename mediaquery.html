<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>responsive grid</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        .container{
            display: grid;
            padding: 15px;
            width: 100%;
            height: 100vh;
            gap: 5px;
            text-align: center;
            grid-template-areas: 
        
            "header header header header header header "
            "main1 main1 main2 main2 main3 main3"
            "footer1 footer1 footer1 footer2 footer2 footer2"
            ;

        }
        .container div{
            background-color: rgb(130, 24, 24);
        }
        .box1{grid-area: header;color: rgb(0, 0, 0);}
        .box2{grid-area: main1;}
        .box3{grid-area: main2;}
        .box4{grid-area: main3;}
        .box5{grid-area: footer1;}
        .box6{grid-area: footer2;}
        
        @media(Max-width:500px){
            .container{grid-template-areas:
            "header"
            "main1"
            "main2"
            "main3"
            "footer1"
            "footer2"
            ;}
            .container div{
                background-color: green;
            }
            
        }
        @media (min-width:501px )  and (max-width:800px){
            .container{
                grid-template-areas: 
                "header header header"
                "main1 main2 main3"
                "footer1 footer1 footer1"
                "footer2 footer2 footer2";
            }
            .container div{
                background-color: rgb(3, 74, 99);
            }
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">
            <h1>Zatrix</h1>
        </div>
        <div class="box2">
           box2
        </div>
        <div class="box3">box3</div>
        <div class="box4">box4</div>
        <div class="box5">box5</div>
        <div class="box6">box6</div>
    </div>
</body>
</html>
