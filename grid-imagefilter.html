<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filter-grid</title>
    <style>
        .container{
            display: grid;
            gap: 10px;
            width: 100%;
            height: 100vh;
            grid-template-areas: 
            "main main main submain submain side1"
            "main main main submain submain side1"
            "main main main submain submain side2"
            "main main main sub1 sub2 side2"
            "main main main sub1 sub2 last"
            ;
        }
           
        
        .main{grid-area: main;}
        .submain{grid-area: submain;}
        .sub1{grid-area: sub1;}
        .sub2{grid-area: sub2;}
        .side1{grid-area: side1;}
        .side2{grid-area: side2;}
        .last{grid-area: last;}

        img{
            width: 100%;
            height: 100%;
            box-shadow: 0px 0px 2px 1px rgb(148, 148, 148);
            border-radius: 5px;
            border: 1px solid white;
        }
        .main img{
            filter: brightness(130%) contrast(120%);
        }
        .submain img{
            filter:saturate(140%) brightness(110%);
        }
        .sub1 img{
            filter: sepia(10%) contrast(130%);
        }
        .sub2 img{
            filter: saturate(0%) blur(.05px);
        }
        .side1 img{
            filter: hue-rotate(2450deg) brightness(110%);
        }
        .side2 img{
            filter:invert(1%) brightness(130%);
        }
        .last img{
            filter:sepia(10%) saturate(150%);
    
        }

    </style>
</head>
<body>
    <div class="container">

        <div class="main">

            <img src="/IMAGES/seashore.jpg" alt="">

        </div>
        <div class="submain">

            <img src="/IMAGES/girl.jpg" alt="">
        </div>
        <div class="sub1">

            <img src="/IMAGES/sunflower.jpg" alt="">

        </div>
        <div class="sub2">

            <img src="/IMAGES/sunset.jpg" alt="">

        </div>
        <div class="side1">

            <img src="/IMAGES/waterfall.jpg" alt="">

        </div>
        <div class="side2">

            <img src="/IMAGES/van.jpg" alt="">

        </div>
        <div class="last">

            <img src="/IMAGES/whiteflower.jpg" alt="">
        </div>
    </div>
</body>
</html>
