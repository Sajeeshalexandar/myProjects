<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic light</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {

            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(90deg, rgb(0, 134, 212), rgb(0, 162, 255), rgb(45, 178, 255), rgb(88, 194, 255));
            width: 100%;
            height: 100vh;
            overflow-y: hidden;
            overflow-x: hidden;
        }

        .container {
            width: 30rem;
            height: 47rem;
            background-color: transparent;
            padding-top: 3rem;


        }

        .post {
            width: 20%;
            height: 40%;
            background: linear-gradient(180deg, black);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            border-radius: 2rem;
            border: 5px solid rgb(218, 218, 218);
            margin: 0 auto;
            box-shadow: 0px 0px 15px 0px rgb(0, 0, 0);



        }

        .green {
            width: 50px;
            height: 50px;
            background-color: rgba(101, 101, 101, 0.389);
            border-radius: 50%;
            transition: .3s ease-in;


        }

        .yellow {
            width: 50px;
            height: 50px;
            background-color: rgba(101, 101, 101, 0.389);
            border-radius: 50%;
            transition: .3s ease-in;



        }

        .red {
            width: 50px;
            height: 50px;
            background-color: rgba(101, 101, 101, 0.389);
            border-radius: 50%;
            transition: .3s ease-in;

        }

        .stand {
            background-color: rgb(218, 218, 218);
            border: 2px solid;
            width: 1rem;
            height: 50rem;
            position: absolute;
            top: 80%;
            left: 50%;
            z-index: -1;
            translate: -50% -50%;

        }

        span {
            font-size: xx-large;
            font-weight: bolder;
            color: rgb(0, 68, 137);

        }

        .container button {
            padding: .6rem 1.5rem;
            margin-left: .5rem;
            margin-bottom: 2rem;
            border-radius: 1rem;
            border: none;
            background-color: rgb(255, 94, 158);
            font-weight: bold;
            color: whitesmoke;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }

        #lightBtn {
            border: 2px solid rgb(255, 94, 158);
            background-color: white;
            color: rgb(255, 94, 158);
        }

        #policeBtn:hover {
            background-color: white;
            color: rgb(255, 94, 158);
        }

        #lightBtn:hover {
            border: 1px solid rgb(255, 255, 255);
            background-color: rgb(255, 94, 158);
            color: white;
        }

        #trafficLight {
            display: none;
            width: 100%;
            height: 100%;

        }

        .pop {
            width: 500px;
            height: 300px;
            background-color: rgb(255, 255, 255);
            box-shadow: 0px 0px 15px 0px rgb(255, 255, 255);
            color: rgb(255, 94, 158);
            position: absolute;
            border-radius: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: xx-large;
            font-weight: bolder;

        }

        .closeButton {

            position: absolute;
            right: 1.5rem;
            top: 1rem;
            color: red;
            font-weight: bolder;
            font-size: x-large;
            border: 0;
            background-color: transparent;


        }

        

       

        /* ROAD */
        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120px;
            background: #333;
        }

        .road::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 6px;
            background: repeating-linear-gradient(to right,
                    white 0 40px,
                    transparent 40px 80px);
            transform: translateY(-50%);
        }

        /* CAR */
        .car {
            position: absolute;
            bottom: 20px;
            left: 50px;
            z-index: 2;

            width: 420px;
            height: 160px;
            animation: move infinite 5s linear;
            animation-timing-function: running;
        }

        /* Car Body */
        .body {
            position: absolute;
            bottom: 30px;
            width: 100%;
            height: 90px;
            background: #e53935;
            border-radius: 25px 40px 15px 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        /* Top */
        .top {
            position: absolute;
            top: 10px;
            left: 90px;
            width: 220px;
            height: 70px;
            background: #d32f2f;
            border-radius: 40px 40px 0 0;
        }

        /* Windows */
        .window {
            position: absolute;
            top: 18px;
            width: 90px;
            height: 40px;
            background: #bbdefb;
            border: 4px solid #222;
        }

        .front-window {
            left: 118px;
            border-radius: 20px 5px 5px 5px;
        }

        .back-window {
            left: 215px;
            border-radius: 5px 20px 5px 5px;
        }

        /* Wheels */
        .wheel {
            position: absolute;
            bottom: -5px;
            width: 80px;
            height: 80px;
            background: #111;
            border-radius: 50%;
            border: 8px solid #666;
            animation: spin 2s linear infinite;
        }

        .wheel::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 25px;
            height: 25px;
            background: #999;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .front-wheel {
            left: 55px;
        }

        .back-wheel {
            right: 55px;
        }

        /* Headlight */
        .light {
            position: absolute;
            right: -8px;
            top: 48px;
            width: 20px;
            height: 12px;
            background: yellow;
            border-radius: 0 10px 10px 0;
            box-shadow: 0 0 15px yellow;
        }

        /* Smoke */
        .smoke {
            position: absolute;
            left: -20px;
            top: 45px;
            width: 15px;
            height: 15px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            animation: smoke 2s infinite;
        }

        .smoke:nth-child(2) {
            left: -40px;
            animation-delay: 0.5s;
        }

        .smoke:nth-child(3) {
            left: -60px;
            animation-delay: 1s;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes smoke {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.8;
            }

            100% {
                transform: translateY(-50px) scale(2);
                opacity: 0;
            }
        }


        @keyframes move {
            0%{
                transform: translateX(-1000px);
            }
            100%{
                transform: translateX(1500px);
            }
        }
    </style>
</head>

<body>
    <div class="car" id="carMove">

        <div class="smoke"></div>
        <div class="smoke"></div>
        <div class="smoke"></div>

        <div class="top"></div>

        <div class="body"></div>

        <div class="window front-window"></div>
        <div class="window back-window"></div>

        <div class="light"></div>

        <div class="wheel front-wheel"></div>
        <div class="wheel back-wheel"></div>

    </div>

    <div class="road"></div>

    <div class="container">
        <span>what will use when traffic occurs..?</span><button id="lightBtn">Traffic Light</button><button
            id="policeBtn">Call police</button>
        <div id="trafficLight">
            <div class="post">
                <div class="green" id="greenLight"></div>
                <div class="yellow" id="orangeLight"></div>
                <div class="red" id="redLight"></div>
            </div>
            <div class="stand"></div>
        </div>

    </div>


    <script>


        var trafficLight = document.getElementById("trafficLight");
        var lightBtn = document.getElementById("lightBtn");


        lightBtn.addEventListener("click", () => {
            trafficLight.style.display = "block";

            var carMove = document.getElementById("carMove");
            carMove.style.animation = "none"

            var green = document.getElementById("greenLight");
            var orange = document.getElementById("orangeLight");
            var red = document.getElementById("redLight");

            function startGreen() {
                green.style.backgroundColor = "rgb(29, 195, 0)";
                green.style.boxShadow = "0px 0px 30px 10px rgb(29, 195, 0)";
            }
            function startOrange() {
                orange.style.backgroundColor = "orange";
                orange.style.boxShadow = "0px 0px 30px 10px orange";
            }
            function startRed() {
                red.style.backgroundColor = "red";
                red.style.boxShadow = "0px 0px 30px 10px red";
            }

            const greenTimer = setTimeout(startGreen, 3000);
            const orangeTimer = setTimeout(startOrange, 6000);
            const redTimer = setTimeout(startRed, 9000);
        })


        var policeBtn = document.getElementById("policeBtn");

        policeBtn.addEventListener("click", () => {


            var msgBox = document.createElement("div");
            msgBox.classList.add("pop");

            var para = document.createElement("p");
            var message = "Calling Police </br> +91 8967543576..!";
            para.innerHTML = message;

            var closeBtn = document.createElement("button");
            closeBtn.classList.add("closeButton");
            closeBtn.innerText = "X"

            msgBox.appendChild(closeBtn);
            msgBox.appendChild(para);
            document.body.appendChild(msgBox)
            lightBtn.disabled = true;
            closeBtn.addEventListener("click", () => {
                msgBox.style.display = "none";
                   lightBtn.disabled = false;
            })
        })

    </script>
</body>

</html>
