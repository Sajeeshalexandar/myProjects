<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{
        margin: 0px;
        padding: 0px;
       }
       body{
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
       }
       .container{
       
        height: 240px;
        width: 130px;
        padding: 20px;
        background-color: rgb(48, 214, 255);
        justify-content: center;
        text-align: center;
        color: rgb(255, 255, 255);
        border-radius: 10px;
        transition: transform 0.3s ease-out,background-color 0.3s ease-out;
        box-shadow: 0px 0px 10px 2px white inset;
        border: 0.3px solid rgb(159, 231, 255);
        
       }
       .container:hover{
        background-color: chartreuse;
        transform: scale3d(1.2,1.2,1);
        img{
            transform: rotate(10deg);
            filter: brightness(150%) contrast(120%) saturate(120%);
            box-shadow: 0px 0px 10px 5px rgb(255, 255, 255);
            border: 0.2px solid white;
        }
        p{
            color: white;
        }
        h1{
            color: yellow;
            text-shadow: none;
            filter: brightness(110%);
        }

       }
       
       
       .container img{
        width: 130px;
        height: 170px;
        border-radius: 5px;
        border: 1px white solid;
        box-shadow: 0px 0px 20px 5px white;
        transition: transform 0.3s ease-out;

       }
       p{
        font-size: 10px;
        font-family: Arial, Helvetica, sans-serif;
        color: rgb(0, 0, 0);
       }
       h1{
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        color: rgb(47, 67, 18);
        text-shadow: 3px 1px 3px rgb(255, 255, 255) ;
       }
        
    </style>
</head>
<body>
    <div class="container">
        <img src="/IMAGES/van.jpg" alt="">
        <h1>Van</h1>
        <p>This is the image of a toy car which is used in the Aadu movie</p>
    </div>
</body>
</html>
